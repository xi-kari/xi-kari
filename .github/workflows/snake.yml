name: Generate contribution snake

on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Dawn palette (東雲):
      #   dark  — a dawn-gold snake crossing a night sky of indigo days
      #   light — a night-indigo snake crossing a field of pale dawn
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/dawn-snake-dark.svg?color_snake=#E8B84B&color_dots=#10152E,#1D2547,#2C3A72,#45549E,#8A76B5
            dist/dawn-snake-light.svg?color_snake=#23263B&color_dots=#EFECE6,#F1DCC8,#E6B9AE,#C793A0,#8F7FB0

      - name: Publish snake SVGs
        run: |
          cd dist
          git init
          git checkout -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution snake"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
