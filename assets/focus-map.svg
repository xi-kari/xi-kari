<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xi-kari focus map</title>
  <desc id="desc">A compact map connecting xi-kari with agent skills, CrossFrame, developer tools, local-first workflows, quiet interfaces, and reusable systems.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#30363D" stroke-opacity=".45" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="960" height="300" rx="8" fill="#0D1117"/>
  <rect width="960" height="300" rx="8" fill="url(#grid)" opacity=".45"/>
  <rect x="18" y="18" width="924" height="264" rx="8" stroke="#30363D" stroke-width="1"/>

  <g stroke-width="1.5" stroke-linecap="round" opacity=".9">
    <path d="M398 130H255" stroke="#58A6FF"/>
    <path d="M398 162H255" stroke="#39D2AE"/>
    <path d="M562 130H705" stroke="#F2CC60"/>
    <path d="M562 162H705" stroke="#58A6FF"/>
    <path d="M480 102V70" stroke="#39D2AE"/>
    <path d="M480 190V224" stroke="#F2CC60"/>
  </g>

  <g filter="url(#soft)">
    <rect x="398" y="102" width="164" height="88" rx="8" fill="#161B22" stroke="#58A6FF"/>
    <text x="480" y="141" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700">xi-kari</text>
    <text x="480" y="166" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">structure -&gt; tools -&gt; practice</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="88" y="106" width="167" height="48" rx="8" fill="#111827" stroke="#58A6FF"/>
    <text x="171.5" y="135" text-anchor="middle" fill="#C9D1D9">agent skills</text>

    <rect x="96" y="146" width="159" height="48" rx="8" fill="#10221F" stroke="#39D2AE"/>
    <text x="175.5" y="175" text-anchor="middle" fill="#C9D1D9">CrossFrame</text>

    <rect x="705" y="106" width="174" height="48" rx="8" fill="#241E12" stroke="#F2CC60"/>
    <text x="792" y="135" text-anchor="middle" fill="#C9D1D9">developer tools</text>

    <rect x="705" y="146" width="174" height="48" rx="8" fill="#111827" stroke="#58A6FF"/>
    <text x="792" y="175" text-anchor="middle" fill="#C9D1D9">local-first</text>

    <rect x="371" y="38" width="258" height="48" rx="8" fill="#10221F" stroke="#39D2AE"/>
    <text x="500" y="67" text-anchor="middle" fill="#C9D1D9">quiet interfaces</text>

    <rect x="371" y="224" width="258" height="48" rx="8" fill="#241E12" stroke="#F2CC60"/>
    <text x="500" y="253" text-anchor="middle" fill="#C9D1D9">reusable systems</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8B949E">
    <text x="34" y="40">profile/readme</text>
    <text x="823" y="260">updated by GitHub Actions</text>
  </g>
</svg>
